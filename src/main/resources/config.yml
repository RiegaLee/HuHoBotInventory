config-version: 14

# 仅排查问题时开启；关闭时普通查询不输出调试日志。
debug: false

online-command:
  name: 我的背包
  aliases: []
  publish-to-menu: false

ender-chest-command:
  name: 我的末影箱
  aliases: []
  publish-to-menu: false

online:
  source-server: local-paper
  cooldown-seconds: 3
  image-file-name: inventory.png
  optional-caption: "Inventory: %player%"

ender-chest:
  enabled: true
  source-server: local-paper
  cooldown-seconds: 3
  image-file-name: ender-chest.png
  optional-caption: "Ender Chest: %player%"

binding:
  # Compatibility only: imported legacy name bindings have not yet proved account ownership.
  allow-legacy-unverified: true

offline-inventory:
  enabled: true
  # Read Paper's original playerdata in read-only mode first; never writes or edits the .dat file.
  direct-playerdata: true
  # Persistent snapshots require verified identity by default, even when live legacy lookup remains compatible.
  allow-legacy-unverified: false
  directory: data/offline-snapshots
  periodic-save-seconds: 300

offline-ender-chest:
  enabled: true
  # Uses the same read-only original playerdata loader as offline inventory queries.
  direct-playerdata: true
  # Kept separate from inventory snapshots so the two data sets can never overwrite each other.
  allow-legacy-unverified: false
  directory: data/offline-ender-chest-snapshots
  periodic-save-seconds: 300

assets:
  vanilla:
    # The JAR already contains the accepted MB7 asset pack. Enable this only to prefer an
    # advanced cache produced by the separate offline Assets Tool.
    prefer-external: false
    cache-directory: data/imported-assets/vanilla
    minecraft-jar: ""
    auto-import: false

player-preview:
  enabled: true
  # Uses the server's current SkinsRestorer skin when available; otherwise an original local default skin.
  provider: auto
  mode: 3d
  cache-directory: cache/skins
  allow-texture-downloads: true
  connect-timeout-ms: 4000
  read-timeout-ms: 8000

render:
  # UI 底板已与物品资源解耦；物品贴图固定采用 Faithful 32x。
  # 可选的用户底图。PNG 放入 plugins/HuHoBotInventory/assets/custom/backgrounds/。
  # 插件会在壁纸上绘制薄荷喵式圆角槽位、人物框和圆角外框。
  custom-background:
    enabled: false
    inventory-file: inventory.png
    # 留空时末影箱复用 inventory-file；也可填写单独的 PNG 文件名。
    ender-chest-file: ""
    # cover 保持比例并居中裁切；stretch 拉伸到整个画布。
    fit: cover
  max-output-bytes: 4194304

messages:
  failure: "背包图片生成或发送失败，请稍后再试"
  usage: "用法：/我的背包 [账号序号]"
  player-offline: "玩家当前不在线，暂时无法查询背包。"
  player-state-changed: "玩家状态发生变化，请重新查询。"
  not-authorized: "权限不足，无法查询在线玩家背包。"
  cooldown: "查询过于频繁，请稍后再试。"
  binding-required: "你还没有绑定 Minecraft 账号，请先在游戏内使用 /authcode 获取验证码，再发送 /绑定 <验证码>。"
  binding-verification-required: "当前绑定尚未完成 Minecraft 账号验证，暂时不能查询背包。"
  offline-snapshot-missing: "暂时没有该玩家的离线背包快照，请等待玩家至少登录服务器一次。"
  offline-legacy-denied: "当前旧版绑定未完成游戏内验证，不能读取持久化离线背包快照。"
  ender-chest-failure: "末影箱图片生成或发送失败，请稍后再试。"
  ender-chest-usage: "用法：/我的末影箱 [账号序号]"
  ender-chest-player-offline: "玩家当前不在线，且暂时没有可用的末影箱快照。"
  ender-chest-player-state-changed: "玩家状态发生变化，请重新查询末影箱。"
  ender-chest-not-authorized: "权限不足，无法查询其他玩家的末影箱。"
  ender-chest-offline-snapshot-missing: "暂时没有该玩家的离线末影箱快照，请等待玩家至少登录服务器一次。"
  ender-chest-offline-legacy-denied: "当前旧版绑定未完成游戏内验证，不能读取持久化离线末影箱快照。"
